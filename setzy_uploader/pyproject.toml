[project]
name = "setzy_uploader"
version = "1.0.0"
description = "Setzy audio file uploader."
authors = [
    {name = "KoltonStarr",email = "carnegieroyce@protonmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard] (>=0.128.0,<0.129.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "boto3 (>=1.42.23,<2.0.0)",
    "python-multipart (>=0.0.21,<0.0.22)",
    "boto3-stubs[s3] (>=1.42.23,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

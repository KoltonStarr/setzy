<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setzy - Sales Call Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Setzy</h1>
            <p class="subtitle">Sales Call Manager</p>
        </header>

        <main>
            <!-- Sales Calls Section -->
            <section class="sales-calls-section">
                <h2>Sales Calls</h2>
                <div id="salesCallsGrid" class="sales-calls-grid">
                    <!-- Sales call cards will be dynamically inserted here -->
                </div>
            </section>

            <!-- Video Upload Section -->
            <section class="upload-section">
                <h2>Upload New Call</h2>
                <div class="upload-container">
                    <div id="dropZone" class="drop-zone">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p class="drop-zone-text">Drag & drop video file here</p>
                        <p class="drop-zone-subtext">or</p>
                        <label for="fileInput" class="file-input-label">Browse Files</label>
                        <input type="file" id="fileInput" accept="video/*" hidden>
                    </div>
                    <div id="uploadStatus" class="upload-status hidden">
                        <p id="uploadMessage"></p>
                    </div>
                </div>
            </section>

            <!-- Chatbot Section -->
            <section class="chatbot-section">
                <h2>AI Assistant</h2>
                <div class="chatbot-container">
                    <div id="chatMessages" class="chat-messages">
                        <div class="message bot-message">
                            <div class="message-content">
                                Hello! I'm your AI assistant. How can I help you analyze your sales calls today?
                            </div>
                        </div>
                    </div>
                    <div class="chat-input-container">
                        <input 
                            type="text" 
                            id="chatInput" 
                            class="chat-input" 
                            placeholder="Ask me anything about your sales calls..."
                            autocomplete="off"
                        >
                        <button id="sendButton" class="send-button">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>

services:
  # For ChromaDB -> OpenTelemetry Collector for observability.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./vector_db/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      - setzy-network

  # For ChromaDB -> Zipkin for distributed tracing.
  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    depends_on:
      - otel-collector
    networks:
      - setzy-network

  # ChromaDB.
  chromadb:
    image: chromadb/chroma
    container_name: chromadb
    volumes:
      - ./vector_db/storage:/data
      - ./vector_db/config.yaml:/config.yaml
    ports:
      - "8000:8000"
    networks:
      - setzy-network
    environment:
      - CHROMA_OPEN_TELEMETRY__ENDPOINT=http://otel-collector:4317/
      - CHROMA_OPEN_TELEMETRY__SERVICE_NAME=chroma
    depends_on:
      - otel-collector
      - zipkin

  # Setzy Agent
  agent:
    image: koltonstarr117/setzy-agent
    container_name: setzy-agent
    env_file:
      - .env
    environment:
      - CHROMADB_HOST=chromadb
    ports:
      - "8081:8081"
    networks:
      - setzy-network
    depends_on:
      - chromadb

  # Uploader Service
  uploader:
    image: koltonstarr117/setzy-uploader
    container_name: setzy-uploader
    env_file:
      - .env
    volumes:
      - ~/.aws:/root/.aws:ro
    ports:
      - "8080:8080"
    networks:
      - setzy-network

  pipeline:
    image: koltonstarr117/setzy-pipeline
    container_name: setzy-pipeline
    profiles: ["pipeline"]  # Won't start by default
    env_file:
      - .env
    environment:
      - CHROMADB_HOST=chromadb
    volumes:
      - ~/.aws:/root/.aws:ro
    networks:
      - setzy-network
    depends_on:
      - chromadb

networks:
  setzy-network:
    driver: bridge

volumes:
  chroma_data:
